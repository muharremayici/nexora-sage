name: Nexora SAGE Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: nexora-sage-quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.resolve.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve fail-closed execution tier
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -B tools/resolve_quality_gate_ci_tier.py
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

  python-runtime-compatibility:
    needs: ci-tier
    if: >-
      needs.ci-tier.outputs.tier == 'pull_request_full_matrix' ||
      needs.ci-tier.outputs.tier == 'direct_main_push_full_matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/engines/package-lock.json
      - name: Compile distributed Python sources
        run: python -B tools/validate_python_runtime_compatibility.py
      - name: Install product and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install TypeScript AST dependency
        run: npm ci --prefix tools/engines --ignore-scripts
      - name: Smoke public CLI
        run: python -B sage.py --help
      - name: Run runtime behavior suite
        run: python -B tools/run_distribution_tests.py
      - name: Prepare explicit CI target repository
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p "$RUNNER_TEMP/sage-ci-target/src"
          printf 'export const ciTarget = true;\n' > "$RUNNER_TEMP/sage-ci-target/src/index.ts"
      - name: Initialize explicit CI target repository
        if: matrix.python-version == '3.12'
        run: python sage.py init --skip-deps --target-root "$RUNNER_TEMP/sage-ci-target"
      - name: Validate installation and contracts
        if: matrix.python-version == '3.12'
        run: CODEMAPS_TARGET_ROOT="$RUNNER_TEMP/sage-ci-target" python sage.py doctor --include-validate --quick --max-seconds 45

  pr-matrix-receipt:
    needs: [ci-tier, python-runtime-compatibility]
    if: >-
      needs.ci-tier.outputs.tier == 'pull_request_full_matrix' &&
      needs.python-runtime-compatibility.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create content-bound PR matrix receipt
        run: >-
          python -B tools/create_quality_gate_pr_matrix_receipt.py
          --output "$RUNNER_TEMP/quality-gate-pr-matrix-receipt.json"
          --pull-request-number "${{ github.event.pull_request.number }}"
          --pull-request-head-sha "${{ github.event.pull_request.head.sha }}"
          --event-sha "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --workflow-run-id "${{ github.run_id }}"
          --workflow-run-attempt "${{ github.run_attempt }}"
      - name: Publish PR matrix receipt
        uses: actions/upload-artifact@v4
        with:
          name: nexora-sage-pr-matrix-receipt
          path: ${{ runner.temp }}/quality-gate-pr-matrix-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  post-merge-reference:
    needs: ci-tier
    if: needs.ci-tier.outputs.tier == 'associated_main_push_reference'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/engines/package-lock.json
      - name: Compile distributed Python sources
        run: python -B tools/validate_python_runtime_compatibility.py
      - name: Install product and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install TypeScript AST dependency
        run: npm ci --prefix tools/engines --ignore-scripts
      - name: Smoke public CLI
        run: python -B sage.py --help
      - name: Run reference-runtime behavior suite
        run: python -B tools/run_distribution_tests.py
      - name: Prepare explicit CI target repository
        run: |
          mkdir -p "$RUNNER_TEMP/sage-ci-target/src"
          printf 'export const ciTarget = true;\n' > "$RUNNER_TEMP/sage-ci-target/src/index.ts"
      - name: Initialize explicit CI target repository
        run: python sage.py init --skip-deps --target-root "$RUNNER_TEMP/sage-ci-target"
      - name: Validate installation and contracts
        run: CODEMAPS_TARGET_ROOT="$RUNNER_TEMP/sage-ci-target" python sage.py doctor --include-validate --quick --max-seconds 45
